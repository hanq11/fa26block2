<!DOCTYPE html>
<html xmlns:th=“http://www.thymeleaf.org”>
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    Them sinh vien:
    <form action="/buoi4/them" method="post">
        id: <input type="text" name="id"> <br>
        ten: <input type="text" name="ten"> <br>
        gioi tinh:
            Nam <input type="radio" name="gioiTinh" value="true">
            Nu <input type="radio" name="gioiTinh" value="false">
        <br>
        diem: <input type="text" name="diem"> <br>
        <button>Them</button>
    </form>
    <br>
    Thong tin sinh vien
    <table>
        <thead>
            <tr>
                <th>id</th>
                <th>ten</th>
                <th>gioiTinh</th>
                <th>diem</th>
            </tr>
        </thead>
        <tbody>
            <th:block th:each="sv : ${listSinhVien}">
                <tr>
                    <td th:text="${sv.id}"></td>
                    <td th:text="${sv.ten}"></td>
                    <td th:text="${sv.gioiTinh}"></td>
                    <td th:text="${sv.diem}"></td>
                </tr>
            </th:block>
        </tbody>
    </table>
</body>
</html>
